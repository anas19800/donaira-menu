<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>المنيو — دونيرا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --red:#ec1c24; --red-dark:#a3121f; --pink:#fdeeee; --orange:#f5a623;
  --bg:#faf7f4; --text:#2c2320; --muted:#9a8f88; --line:#eee5df;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text)}
.hero{background:linear-gradient(135deg,#c8101c,#ec1c24 60%,#f0413d);color:#fff;padding:26px 16px 60px;text-align:center;position:relative}
.hero img.logo{width:auto;height:86px;border-radius:14px;object-fit:contain;margin-bottom:8px}
.hero h1{font-size:28px;font-weight:900}
.hero .en{font-size:14px;opacity:.9;letter-spacing:1px}
.hero .slogan{font-size:14px;opacity:.92;margin-top:4px}
.langbtn{position:absolute;top:14px;left:14px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:20px;padding:4px 14px;font-family:inherit;font-weight:700;cursor:pointer}
nav{position:sticky;top:0;z-index:40;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.06);margin-top:-34px;border-radius:18px 18px 0 0;padding:10px 8px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{flex-shrink:0;padding:7px 16px;border-radius:20px;background:#f4ece8;color:var(--text);text-decoration:none;font-weight:800;font-size:13.5px;transition:.15s;white-space:nowrap}
nav a.active,nav a:hover{background:var(--red);color:#fff}
main{max-width:1000px;margin:0 auto;padding:10px 14px 60px}
section{padding-top:18px}
section h2{font-size:21px;color:var(--red-dark);font-weight:900;margin:8px 4px 12px;display:flex;align-items:center;gap:10px}
section h2 .en{font-size:13px;color:var(--muted);font-weight:600}
section h2:after{content:"";flex:1;height:2px;background:linear-gradient(to left,var(--pink),transparent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:.18s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(140,60,40,.12)}
.card .imgwrap{aspect-ratio:4/3;background:#f3ede9;overflow:hidden}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card .body{padding:10px 12px 12px;flex:1;display:flex;flex-direction:column;gap:4px}
.card .nm{font-weight:800;font-size:16px;line-height:1.3}
.card .en{font-size:12px;color:var(--muted)}
.card .desc{font-size:12.5px;color:#7a6f68;line-height:1.5}
.card .foot{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:8px}
.price{background:var(--pink);color:var(--red-dark);font-weight:900;border-radius:9px;padding:3px 12px;font-size:15px}
.price small{font-weight:600;font-size:10px;margin-inline-start:2px}
.plabel{font-size:10px;color:var(--muted);display:block;text-align:center;font-weight:700}
.kcal{font-size:11px;color:#fff;background:var(--orange);border-radius:7px;padding:2px 8px;margin-inline-start:auto}
footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}
.noimg{display:flex;align-items:center;justify-content:center;height:100%;font-size:40px;opacity:.25}
</style>
</head>
<body>
<div class="hero" id="hero">
  <button class="langbtn" id="btnLang">EN</button>
  <div id="heroContent"></div>
</div>
<nav id="nav"></nav>
<main id="main"></main>
<footer id="foot"></footer>
<script>
let DB=null, LANG='ar';
const $=s=>document.querySelector(s);
function imgSrc(u){ return u ? (u.startsWith('/uploads/') ? u.slice(1) : u) : ''; }
function nm(o){ return LANG==='ar' ? (o.name_ar||o.name_en) : (o.name_en||o.name_ar); }
function sub(o){ const p=nm(o); const s=LANG==='ar'?o.name_en:o.name_ar; return s&&s!==p?s:''; }
function ds(o){ return LANG==='ar' ? o.desc_ar : (o.desc_en||o.desc_ar); }

async function load(){
  DB = await (await fetch('./data.json?t='+Date.now())).json();
  render();
}
function render(){
  document.documentElement.dir = LANG==='ar'?'rtl':'ltr';
  document.documentElement.lang = LANG;
  $('#btnLang').textContent = LANG==='ar'?'EN':'عربي';
  const s = DB.settings;
  document.title = (LANG==='ar'?'المنيو — ':'Menu — ')+(LANG==='ar'?s.name_ar:s.name_en||s.name_ar);
  $('#heroContent').innerHTML = `
    ${s.logo?`<img class="logo" src="${imgSrc(s.logo)}">`:''}
    <h1>${LANG==='ar'?s.name_ar:(s.name_en||s.name_ar)}</h1>
    ${s.name_en&&LANG==='ar'?`<div class="en">${s.name_en}</div>`:''}
    ${s.slogan?`<div class="slogan">${s.slogan}</div>`:''}`;

  const cats = DB.categories.filter(c=>c.visible!==false).sort((a,b)=>a.order-b.order)
    .filter(c=>DB.items.some(i=>i.categoryId===c.id&&i.visible!==false));
  $('#nav').innerHTML = cats.map(c=>`<a href="#c-${c.id}" data-id="${c.id}">${nm(c)}</a>`).join('');
  const cur = s.currency||'ر.س';
  $('#main').innerHTML = cats.map(c=>{
    const items = DB.items.filter(i=>i.categoryId===c.id&&i.visible!==false).sort((a,b)=>a.order-b.order);
    return `<section id="c-${c.id}">
      <h2>${nm(c)} ${sub(c)?`<span class="en">${sub(c)}</span>`:''}</h2>
      <div class="grid">${items.map(i=>`
        <div class="card">
          <div class="imgwrap">${i.image?`<img loading="lazy" src="${imgSrc(i.image)}" onerror="this.parentNode.innerHTML='<div class=noimg>🍽️</div>'">`:'<div class="noimg">🍽️</div>'}</div>
          <div class="body">
            <div class="nm">${nm(i)}</div>
            ${sub(i)?`<div class="en">${sub(i)}</div>`:''}
            ${ds(i)?`<div class="desc">${ds(i)}</div>`:''}
            <div class="foot">
              <div>${i.price_label&&i.price2!=null?`<span class="plabel">${i.price_label}</span>`:''}<span class="price">${i.price}<small>${cur}</small></span></div>
              ${i.price2!=null?`<div>${i.price2_label?`<span class="plabel">${i.price2_label}</span>`:''}<span class="price">${i.price2}<small>${cur}</small></span></div>`:''}
              ${i.calories!=null?`<span class="kcal">${i.calories} kcal</span>`:''}
            </div>
          </div>
        </div>`).join('')}
      </div>
    </section>`;
  }).join('');
  $('#foot').textContent = (DB.settings.name_ar||'') + ' © ' + new Date().getFullYear();

  // active nav on scroll
  const links=[...document.querySelectorAll('nav a')];
  const obs=new IntersectionObserver(es=>{
    es.forEach(e=>{ if(e.isIntersecting){
      links.forEach(l=>l.classList.toggle('active',l.dataset.id===e.target.id.slice(2)));
    }});
  },{rootMargin:'-20% 0px -70% 0px'});
  cats.forEach(c=>obs.observe(document.getElementById('c-'+c.id)));
}
$('#btnLang').onclick=()=>{ LANG = LANG==='ar'?'en':'ar'; render(); };
load();
</script>
</body>
</html>
